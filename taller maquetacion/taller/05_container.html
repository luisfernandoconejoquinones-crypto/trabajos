<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviePlus</title>
    <link rel="stylesheet" href="CSS/05_container.css">
</head>
<body>

    <div class="contenedor">

        <div class="texto">
            <h1>¡Disfruta las mejores películas y series!</h1>

            <p>
                Suscríbete a MoviePlus y accede a miles de películas,
                series exclusivas y estrenos en alta calidad desde cualquier dispositivo.
            </p>
        </div>

        <div class="formulario">

            <label>Correo Electrónico</label>
            <input type="email" placeholder="tu-correo@email.com">

            <label>Contraseña</label>
            <input type="password" placeholder="Crea tu contraseña">

            <div class="recordar">
                <input type="checkbox">
                <span>Recordar mi cuenta</span>
            </div>

            <button>Comenzar Prueba Gratis</button>

            <p class="info">
                Al registrarte aceptas nuestros términos y políticas de privacidad.
            </p>

        </div>

    </div>

</body>
</html>
